<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b1020;color:#eef1f8;font:15px/1.45 Poppins,system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px 16px}
.card{width:100%;max-width:420px;background:#121a33;border:1px solid #243058;border-radius:20px;padding:26px 22px}
h1{font-size:1.35rem;margin:0 0 4px;font-weight:800}
.sub{color:#9aa8cf;font-size:.88rem;margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:#0b1020;border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;color:#9aa8cf;font:inherit;font-weight:600;padding:.55rem;border-radius:9px;cursor:pointer}
.tabs button.on{background:#2065fe;color:#fff}
label{display:block;font-size:.8rem;color:#9aa8cf;margin:10px 0 4px}
input{width:100%;padding:.75rem .85rem;border-radius:12px;border:1px solid #2c3a6b;background:#0b1020;color:#fff;font:inherit}
input:focus{outline:2px solid #2065fe;border-color:#2065fe}
.btn{width:100%;margin-top:16px;padding:.85rem;border:0;border-radius:12px;background:#2065fe;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:#1b2750;margin-top:10px}
.btn:disabled{opacity:.6}
.err{background:#3a1420;color:#ffb4c0;border-radius:10px;padding:.6rem .8rem;margin-top:12px;font-size:.85rem;display:none}
.ok{background:#10321f;color:#9be7b8;border-radius:10px;padding:.6rem .8rem;margin-top:12px;font-size:.85rem;display:none}
.hello{font-size:1.1rem;font-weight:800;margin:0 0 4px}
.foot{margin-top:18px;text-align:center;color:#6f7fae;font-size:.75rem}
.link{background:none;border:0;color:#7fb0ff;font:inherit;font-size:.82rem;cursor:pointer;padding:0;margin-top:12px;text-decoration:underline}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1f2a52;color:#fff;padding:.7rem 1rem;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:200000;max-width:90vw;font-size:.88rem}
.toast.show{opacity:1;transform:translateX(-50%)}.toast.error{background:#5a1a28}
.btn2,.btn-primary{}

body.dash{align-items:flex-start}.card.wide{max-width:980px;background:none;border:0;padding:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.top .hello{margin:0;font-size:1.3rem}.top .sub{margin:2px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{width:auto;margin:0;padding:.6rem 1rem;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#121a33;border:1px solid #243058;border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}.stat span{color:#9aa8cf;font-size:.78rem}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:#121a33;border:1px solid #243058;border-radius:16px;padding:14px}
.panel h2{font-size:.95rem;margin:0 0 10px;font-weight:700}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-h b{font-size:1rem}
.cal-h button{background:#1b2750;border:0;color:#fff;border-radius:9px;width:34px;height:34px;font-size:1rem;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dn{font-size:.68rem;color:#6f7fae;text-align:center;padding:2px 0}
.cal .d{aspect-ratio:1/1;border-radius:10px;background:#0b1020;border:1px solid transparent;padding:4px;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;color:#cfd8f5;font-family:inherit;text-align:left}
.cal .d.o{opacity:.35}.cal .d.t{border-color:#2065fe}.cal .d.s{background:#1b2f66;border-color:#4f8bff}
.cal .d i{margin-top:auto;display:flex;gap:2px;font-style:normal}.cal .d i u{width:6px;height:6px;border-radius:50%;background:#4f8bff;display:block}.cal .d i u.dn2{background:#3ddc84}
.item{background:#0b1020;border:1px solid #243058;border-radius:12px;padding:10px;margin-bottom:8px}
.item.done{opacity:.55}.item .t1{font-weight:600;font-size:.88rem}.item .t2{color:#9aa8cf;font-size:.74rem;margin-top:2px}
.item .acts{display:flex;gap:6px;margin-top:8px}.item .acts button{background:#1b2750;border:0;color:#fff;border-radius:8px;padding:.35rem .6rem;font:inherit;font-size:.75rem;cursor:pointer}
.empty{color:#6f7fae;font-size:.82rem}
select,textarea{width:100%;padding:.7rem .8rem;border-radius:12px;border:1px solid #2c3a6b;background:#0b1020;color:#fff;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="card">
  <div id="v-out">
    <h1>Creator Studio</h1>
    <p class="sub">Make videos and banners with your own name on them.</p>
    <div class="tabs"><button id="t-up" class="on" type="button">Create account</button><button id="t-in" type="button">Log in</button></div>
    <div id="f-name"><label for="a-name">Your name / media name</label><input id="a-name" maxlength="24" placeholder="e.g. John Media" autocomplete="nickname"></div>
    <label for="a-email">Email</label><input id="a-email" type="email" autocomplete="username" placeholder="you@email.com">
    <label for="a-pass">Password</label><input id="a-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    <div class="err" id="a-err"></div><div class="ok" id="a-ok"></div>
    <button class="btn" id="a-go" type="button">Create account</button>
  </div>
  <div id="v-in" class="hidden">
    <div class="top"><div><p class="hello" id="h-name"></p><p class="sub">Your name is on every banner, watermark and video you make.</p></div>
      <div class="row"><button type="button" class="btn" id="vs-open"><i class="ti ti-movie" aria-hidden="true"></i> Video Studio</button><button type="button" class="btn alt" id="b-rename">Change name</button><button type="button" class="btn alt" id="b-out">Log out</button></div></div>
    <div class="stats">
      <div class="stat"><b id="s-up">0</b><span>Coming up</span></div>
      <div class="stat"><b id="s-wk">0</b><span>This week</span></div>
      <div class="stat"><b id="s-dn">0</b><span>Done</span></div>
      <div class="stat"><b id="s-nx">—</b><span>Next post</span></div>
    </div>
    <div class="grid">
      <div class="panel"><div class="cal-h"><button type="button" id="c-prev" aria-label="Previous month">‹</button><b id="c-title"></b><button type="button" id="c-next" aria-label="Next month">›</button></div><div class="cal" id="cal"></div></div>
      <div>
        <div class="panel" style="margin-bottom:12px"><h2 id="f-h">Schedule a post</h2>
          <label for="p-title">What is the post?</label><input id="p-title" maxlength="120" placeholder="e.g. Goal highlights video">
          <div class="two"><div><label for="p-date">Date</label><input id="p-date" type="date"></div><div><label for="p-time">Time</label><input id="p-time" type="time" value="12:00"></div></div>
          <label for="p-plat">Where</label><select id="p-plat"><option value="any">Any</option><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="tiktok">TikTok</option><option value="youtube">YouTube</option><option value="whatsapp">WhatsApp</option></select>
          <label for="p-note">Note (optional)</label><textarea id="p-note" rows="2" maxlength="500"></textarea>
          <button type="button" class="btn" id="p-save">Save to calendar</button><button type="button" class="btn alt hidden" id="p-cancel">Cancel edit</button>
        </div>
        <div class="panel"><h2 id="l-h">Plans</h2><div id="list"></div></div>
      </div>
    </div>
  </div>
  <div class="foot">Powered by Denis Jackson</div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://cgoxglsepltjbemnlmqx.supabase.co','sb_publishable_USnTAF6QDYaD2Oauc7lgxQ_4s-WVmA9');
let isLoggedIn=false,mode='up';
const $=id=>document.getElementById(id);
function showToast(m,t){const e=$('toast');e.textContent=m;e.className='toast '+(t||'success')+' show';setTimeout(()=>e.classList.remove('show'),3200);}
function cleanName(s){return String(s||'').replace(/[<>"'&]/g,'').replace(/\s+/g,' ').trim().slice(0,24);}
function setMode(m){mode=m;$('t-up').classList.toggle('on',m==='up');$('t-in').classList.toggle('on',m==='in');$('f-name').classList.toggle('hidden',m!=='up');$('a-go').textContent=m==='up'?'Create account':'Log in';$('a-pass').autocomplete=m==='up'?'new-password':'current-password';$('a-err').style.display=$('a-ok').style.display='none';}
function say(id,t){const e=$(id);e.textContent=t;e.style.display='block';}
function enter(user){
  const b=cleanName(user.user_metadata&&user.user_metadata.brand)||cleanName((user.email||'').split('@')[0]);
  window.BUZA_BRAND=b;isLoggedIn=true;try{sb.rpc('touch_creator');}catch(e){}
  $('v-out').classList.add('hidden');$('v-in').classList.remove('hidden');$('h-name').textContent='Welcome, '+b;document.body.classList.add('dash');document.querySelector('.card').classList.add('wide');DASH.start(user);
}
async function go(){
  const email=$('a-email').value.trim(),pass=$('a-pass').value,name=cleanName($('a-name').value);
  $('a-err').style.display=$('a-ok').style.display='none';
  if(!email||!pass){say('a-err','Enter your email and password.');return;}
  if(mode==='up'&&name.length<2){say('a-err','Enter your name (at least 2 letters).');return;}
  if(mode==='up'&&pass.length<6){say('a-err','Password must be at least 6 characters.');return;}
  $('a-go').disabled=true;
  try{
    if(mode==='up'){
      const r=await sb.auth.signUp({email,password:pass,options:{data:{brand:name}}});
      if(r.error)throw r.error;
      if(r.data&&r.data.session){enter(r.data.user);}
      else say('a-ok','Account created. Check your email and press the confirm link, then come back here and log in.');
    }else{
      const r=await sb.auth.signInWithPassword({email,password:pass});
      if(r.error)throw r.error;enter(r.data.user);
    }
  }catch(e){
    const m=String(e&&e.message||e);
    say('a-err',/already|registered/i.test(m)?'This email already has an account. Press Log in.':/invalid login/i.test(m)?'Wrong email or password.':/confirm/i.test(m)?'Please confirm your email first (check your inbox).':'Could not continue: '+m.slice(0,120));
  }
  $('a-go').disabled=false;
}
$('t-up').onclick=()=>setMode('up');$('t-in').onclick=()=>setMode('in');$('a-go').onclick=go;
$('a-pass').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
$('b-out').onclick=async()=>{try{await sb.auth.signOut();}catch(e){}location.reload();};
$('b-rename').onclick=async()=>{
  const n=cleanName(prompt('New name:',window.BUZA_BRAND)||'');if(n.length<2)return;
  const r=await sb.auth.updateUser({data:{brand:n}});
  if(r.error){showToast('Could not change the name.','error');return;}
  try{const u=await sb.auth.getUser();if(u.data&&u.data.user)await sb.from('creators').update({brand:n}).eq('id',u.data.user.id);}catch(e){}
  window.BUZA_BRAND=n;$('h-name').textContent='Welcome, '+n;showToast('Name changed.');
};

const DASH=(()=>{
  let plans=[],uid=null,view=new Date(),sel=null,edit=null,loaded=false;
  const pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const PL={any:'Any',instagram:'Instagram',facebook:'Facebook',tiktok:'TikTok',youtube:'YouTube',whatsapp:'WhatsApp'};
  const when=p=>new Date(p.plan_date+'T'+(p.plan_time||'12:00').slice(0,5)+':00');
  function fmtDay(k){const d=new Date(k+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});}
  function stats(){
    const now=new Date(),wk=new Date(now.getTime()+7*86400000);
    const up=plans.filter(p=>!p.done&&when(p)>=now).sort((a,b)=>when(a)-when(b));
    $('s-up').textContent=up.length;$('s-wk').textContent=up.filter(p=>when(p)<=wk).length;$('s-dn').textContent=plans.filter(p=>p.done).length;
    $('s-nx').textContent=up.length?fmtDay(up[0].plan_date)+' '+(up[0].plan_time||'').slice(0,5):'—';
  }
  function cal(){
    const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),today=key(new Date());
    $('c-title').textContent=view.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    let h=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="dn">'+x+'</div>').join('');
    for(let i=0;i<start;i++)h+='<div></div>';
    for(let d=1;d<=days;d++){
      const k=y+'-'+pad(m+1)+'-'+pad(d),ps=plans.filter(p=>p.plan_date===k);
      h+='<button type="button" class="d'+(k===today?' t':'')+(k===sel?' s':'')+'" data-k="'+k+'">'+d+(ps.length?'<i>'+ps.slice(0,4).map(p=>'<u class="'+(p.done?'dn2':'')+'"></u>').join('')+'</i>':'')+'</button>';
    }
    $('cal').innerHTML=h;
  }
  function list(){
    const up=sel?plans.filter(p=>p.plan_date===sel):plans.filter(p=>!p.done&&when(p)>=new Date()).sort((a,b)=>when(a)-when(b)).slice(0,12);
    $('l-h').textContent=sel?'Plans for '+fmtDay(sel):'Coming up';
    const rows=up.sort((a,b)=>when(a)-when(b));
    $('list').innerHTML=(sel?'<div style="margin-bottom:8px"><button type="button" class="btn alt" style="margin:0;padding:.4rem .8rem;font-size:.78rem;width:auto" id="l-all">Show all coming up</button></div>':'')+(rows.length?rows.map(p=>'<div class="item'+(p.done?' done':'')+'"><div class="t1">'+esc(p.title)+'</div><div class="t2">'+fmtDay(p.plan_date)+' · '+(p.plan_time||'').slice(0,5)+' · '+PL[p.platform]+(p.note?'<br>'+esc(p.note):'')+'</div><div class="acts"><button data-a="done" data-id="'+p.id+'">'+(p.done?'Undo':'✓ Done')+'</button><button data-a="edit" data-id="'+p.id+'">Edit</button><button data-a="del" data-id="'+p.id+'">Delete</button></div></div>').join(''):'<div class="empty">'+(sel?'Nothing planned on this day.':'Nothing planned yet. Pick a day and add your first post.')+'</div>');
  }
  function refresh(){stats();cal();list();}
  function reset(){edit=null;$('f-h').textContent='Schedule a post';$('p-title').value='';$('p-note').value='';$('p-plat').value='any';$('p-save').textContent='Save to calendar';$('p-cancel').classList.add('hidden');}
  async function save(){
    const title=$('p-title').value.trim(),date=$('p-date').value,time=$('p-time').value||'12:00';
    if(!title){showToast('Write what the post is.','error');return;}
    if(!date){showToast('Choose a date.','error');return;}
    const row={plan_date:date,plan_time:time,title,platform:$('p-plat').value,note:$('p-note').value.trim()||null};
    $('p-save').disabled=true;
    try{
      if(edit){const r=await sb.from('creator_plans').update(row).eq('id',edit).select().single();if(r.error)throw r.error;plans=plans.map(p=>p.id===edit?r.data:p);}
      else{const r=await sb.from('creator_plans').insert(row).select().single();if(r.error)throw r.error;plans.push(r.data);}
      showToast('Saved to your calendar.');sel=date;view=new Date(date+'T00:00:00');reset();$('p-date').value=date;refresh();
    }catch(e){showToast('Could not save. Try again.','error');}
    $('p-save').disabled=false;
  }
  async function act(a,id){
    const p=plans.find(x=>x.id===id);if(!p)return;
    if(a==='done'){const r=await sb.from('creator_plans').update({done:!p.done}).eq('id',id);if(r.error){showToast('Could not update.','error');return;}p.done=!p.done;}
    else if(a==='del'){if(!confirm('Delete this plan?'))return;const r=await sb.from('creator_plans').delete().eq('id',id);if(r.error){showToast('Could not delete.','error');return;}plans=plans.filter(x=>x.id!==id);}
    else if(a==='edit'){edit=id;$('f-h').textContent='Edit post';$('p-title').value=p.title;$('p-date').value=p.plan_date;$('p-time').value=(p.plan_time||'12:00').slice(0,5);$('p-plat').value=p.platform;$('p-note').value=p.note||'';$('p-save').textContent='Save changes';$('p-cancel').classList.remove('hidden');$('p-title').scrollIntoView({behavior:'smooth',block:'center'});return;}
    refresh();
  }
  function wire(){
    $('c-prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);cal();};
    $('c-next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);cal();};
    $('cal').onclick=e=>{const b=e.target.closest('button[data-k]');if(!b)return;sel=sel===b.dataset.k?null:b.dataset.k;if(sel&&!edit)$('p-date').value=sel;cal();list();};
    $('list').onclick=e=>{if(e.target.id==='l-all'){sel=null;cal();list();return;}const b=e.target.closest('button[data-a]');if(b)act(b.dataset.a,b.dataset.id);};
    $('p-save').onclick=save;$('p-cancel').onclick=reset;
  }
  async function start(user){
    uid=user&&user.id;if(!loaded){wire();loaded=true;}
    $('p-date').value=key(new Date());
    const r=await sb.from('creator_plans').select('*').order('plan_date',{ascending:true}).limit(500);
    plans=r.error?[]:(r.data||[]);if(r.error)showToast('Could not load your calendar.','error');
    refresh();
  }
  return {start};
})();
(async()=>{try{const {data}=await sb.auth.getSession();if(data&&data.session)enter(data.session.user);}catch(e){}})();
</script>
<script src="video-studio.js" defer></script>
</body>
</html>
