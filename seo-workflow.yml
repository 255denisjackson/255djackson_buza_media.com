name: Build article pages and sitemaps
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: seo-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-seo.mjs
      - name: Commit changes
        run: |
          git config user.name "buza-media-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A a sitemap.xml news-sitemap.xml feed.xml
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "Update article pages and sitemaps" && git push; fi
